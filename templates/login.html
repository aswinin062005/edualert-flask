<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAlert - HOD Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.75) 0%, rgba(15, 23, 42, 0.95) 100%),
                        url("{{ url_for('static', filename='college.jpg') }}") center/cover no-repeat;
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
        }
        .form-section { display: none; }
        .form-section.active { display: block; }
        .toggle-link {
            cursor: pointer;
            color: #0d6efd;
            text-decoration: underline;
            font-weight: 600;
        }
        .toggle-link:hover { color: #0a58ca; }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Header with College Background Image -->
        <div class="login-header">
            <i class="bi bi-mortarboard-fill fs-1 text-warning mb-2 d-block"></i>
            <h3 class="fw-bold mb-1">EduAlert Portal</h3>
            <p class="small text-white-50 mb-0" id="header-subtitle">Sign in to your account</p>
        </div>

        <div class="p-4">
            {% if error %}
            <div class="alert alert-danger rounded-3 small py-2">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
            </div>
            {% endif %}

            {% if success %}
            <div class="alert alert-success rounded-3 small py-2">
                <i class="bi bi-check-circle-fill me-1"></i> {{ success }}
            </div>
            {% endif %}

            <!-- 1. LOGIN -->
            <div id="login-section" class="form-section active">
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Email or Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" name="identifier" class="form-control" placeholder="Enter email or 10-digit mobile" required>
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label fw-semibold small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="text-end mb-3">
                        <span class="small toggle-link" onclick="showSection('forgot-section')">Forgot Password?</span>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>
                <div class="text-center small text-muted">
                    Don't have an account? <span class="toggle-link" onclick="showSection('signup-section')">Sign Up</span>
                </div>
            </div>

            <!-- 2. SIGN UP -->
            <div id="signup-section" class="form-section">
                <form action="/signup" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="e.g. hod_cse" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="hod@college.edu" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                            <input type="tel" name="phone" class="form-control" placeholder="9876543210" pattern="[0-9]{10}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Create password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3 mb-3">
                        <i class="bi bi-person-plus-fill me-1"></i> Create Account
                    </button>
                </form>
                <div class="text-center small text-muted">
                    Already have an account? <span class="toggle-link" onclick="showSection('login-section')">Sign In</span>
                </div>
            </div>

            <!-- 3. FORGOT PASSWORD -->
            <div id="forgot-section" class="form-section">
                <form action="/reset-password" method="POST">
                    <p class="small text-muted mb-3">Enter your registered phone number to reset your password.</p>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-telephone-fill"></i></span>
                            <input type="tel" name="phone" class="form-control" placeholder="9876543210" pattern="[0-9]{10}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                            <input type="password" name="new_password" class="form-control" placeholder="Enter new password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold rounded-3 mb-3 text-dark">
                        <i class="bi bi-arrow-repeat me-1"></i> Reset Password
                    </button>
                </form>
                <div class="text-center small text-muted">
                    <span class="toggle-link" onclick="showSection('login-section')">Back to Sign In</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showSection(id) {
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            const sub = document.getElementById('header-subtitle');
            sub.innerText = id === 'login-section' ? 'Sign in to your account' : (id === 'signup-section' ? 'Register new HOD profile' : 'Password Recovery');
        }
    </script>
</body>
</html>
